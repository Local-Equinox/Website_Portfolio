<!doctype html>
<!-- Dark mode is the default: the "dark" class ships in the HTML. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- [INSERT: FULL NAME (e.g., John Erwin F. Cadiz)] : shown in the browser tab -->
    <title>John Erwin F. Cadiz | Portfolio</title>
    <!-- [INSERT: SHORT BIO/ABOUT ME] : one sentence, shown in search results -->
    <meta name="description" content="An aspiring and diligent Software Engineer, interested in the field of Machine Learning and Artificial Intelligence and also Robotics." />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b9f33c'/%3E%3Cpath d='M10 11l-4 5 4 5M22 11l4 5-4 5M18 9l-4 14' fill='none' stroke='%2308090b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <!-- Runs before first paint so a saved light theme never flashes dark. -->
    <script>
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
